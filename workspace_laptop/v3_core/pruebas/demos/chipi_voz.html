<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chipi - Voz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#e94560;margin-bottom:5px;font-size:24px}
#status{padding:8px 16px;border-radius:20px;margin-bottom:15px;font-size:13px;font-weight:bold;transition:all .3s}
#chat{width:100%;max-width:600px;flex:1;overflow-y:auto;padding:10px;margin-bottom:15px;min-height:200px;max-height:60vh;border:1px solid #333;border-radius:12px}
.msg{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:85%;word-wrap:break-word;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.user{background:#0f3460;margin-left:auto;border-bottom-right-radius:4px}
.chipi{background:#533483;margin-right:auto;border-bottom-left-radius:4px}
.label{font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;opacity:.7}
.user .label{color:#16c79a}.chipi .label{color:#e94560}
.controls{display:flex;gap:12px;align-items:center;margin-bottom:15px;width:100%;max-width:600px}
#micBtn{width:72px;height:72px;border-radius:50%;border:3px solid #e94560;background:transparent;color:#e94560;font-size:28px;cursor:pointer;transition:all .3s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#micBtn:hover{background:rgba(233,69,96,.1)}
#micBtn.listening{background:#e94560;color:#fff;animation:pulse 1s infinite}
#micBtn.thinking{background:#f4d03f;color:#000}
#micBtn.speaking{background:#16c79a;color:#000}
#micBtn.error{background:#e94560;color:#fff;animation:flash .3s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.3}}
#textInput{flex:1;padding:12px 16px;border-radius:25px;border:2px solid #333;background:#0a0a1a;color:#fff;font-size:15px;outline:none}
#textInput:focus{border-color:#e94560}
#sendBtn{width:44px;height:44px;border-radius:50%;border:2px solid #16c79a;background:transparent;color:#16c79a;font-size:18px;cursor:pointer;flex-shrink:0}
#sendBtn:hover{background:rgba(22,199,154,.1)}
#btnLabel{font-size:12px;color:#888;margin-top:4px;text-align:center}
#errorArea{display:none;background:rgba(233,69,96,.15);border:1px solid #e94560;color:#e94560;padding:10px 16px;border-radius:8px;margin-bottom:15px;max-width:600px;width:100%;font-size:13px}
</style>
</head>
<body>
<h1>Chipi</h1>
<div id="status">Listo</div>
<div id="errorArea"></div>
<div id="chat"></div>
<div class="controls">
  <div style="display:flex;flex-direction:column;align-items:center">
    <button id="micBtn" title="Presiona para hablar">M</button>
    <span id="btnLabel">Presiona para hablar</span>
  </div>
  <input type="text" id="textInput" placeholder="Escribe tu mensaje..." />
  <button id="sendBtn" title="Enviar">></button>
</div>

<script>
/* ===== CONFIG ===== */
const BACKEND_URL = window.location.origin;
const CHAT_URL = BACKEND_URL + '/api/llm/chat';
const STATUS_URL = BACKEND_URL + '/api/status';
const TTS_URL = BACKEND_URL + '/api/tts/speak';

/* ===== DOM REFS ===== */
const micBtn = document.getElementById('micBtn');
const btnLabel = document.getElementById('btnLabel');
const statusEl = document.getElementById('status');
const chatEl = document.getElementById('chat');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const errorArea = document.getElementById('errorArea');

/* ===== STATE ===== */
let conversationHistory = [];
let isThinking = false;
let recognition = null;
let speechSynth = window.speechSynthesis;
let ttsEnabled = true;

/* ===== HELPERS ===== */
function stripEmojis(text) {
  return text.replace(/[\u{1F000}-\u{1FFFF}]|[\u2600-\u27BF}]|[\u{2700}-\u{27BF}]|[\u{FE00}-\u{FE0F}]|[\u{200D}]|[\u231A-\u231B}]|[\u23E9-\u23F3}]|[\u23F8-\u23FA}]|[\u25AA-\u25AB}]|[\u25B6}]|[\u25C0}]|[\u25FB-\u25FE}]|[\u2600-\u27BF}]|[\u2934-\u2935}]|[\u2B05-\u2B07}]|[\u2B1B-\u2B1C}]|[\u2B50}]|[\u2B55}]|[\u3030}]|[\u303D}]|[\u3297}]|[\u3299}]/gu, '').trim();
}

function stripEmojisSimple(text) {
  return text.replace(/[^\p{L}\p{N}\p{P}\p{Z}]/gu, '').trim();
}

function speakText(text) {
  if (!ttsEnabled || !speechSynth) return;
  const clean = stripEmojis(text);
  if (!clean) return;

  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
  }

  const utterance = new SpeechSynthesisUtterance(clean);
  utterance.lang = 'es-PE';
  utterance.rate = 1.0;
  utterance.pitch = 1.1;

  utterance.onstart = () => updateUI('speaking');
  utterance.onend = () => { if (!isThinking) updateUI('ready'); };
  utterance.onerror = () => { if (!isThinking) updateUI('ready'); };

  window.speechSynthesis.speak(utterance);
}

function updateUI(state) {
  micBtn.className = '';
  switch(state) {
    case 'listening':
      micBtn.classList.add('listening');
      btnLabel.textContent = 'Escuchando...';
      statusEl.textContent = 'Escuchando...';
      statusEl.style.background = 'rgba(233,69,96,.2)';
      break;
    case 'thinking':
      isThinking = true;
      micBtn.classList.add('thinking');
      btnLabel.textContent = 'Pensando...';
      statusEl.textContent = 'Pensando...';
      statusEl.style.background = 'rgba(244,208,63,.2)';
      break;
    case 'speaking':
      micBtn.classList.add('speaking');
      btnLabel.textContent = 'Hablando...';
      statusEl.textContent = 'Hablando...';
      statusEl.style.background = 'rgba(22,199,154,.2)';
      break;
    case 'error':
      micBtn.classList.add('error');
      btnLabel.textContent = 'Error';
      statusEl.textContent = 'Error';
      statusEl.style.background = 'rgba(233,69,96,.2)';
      break;
    default:
      isThinking = false;
      btnLabel.textContent = 'Presiona para hablar';
      statusEl.textContent = 'Listo';
      statusEl.style.background = 'transparent';
  }
}

function showError(msg) {
  errorArea.style.display = 'block';
  errorArea.textContent = '[Error] ' + msg;
  setTimeout(() => { errorArea.style.display = 'none'; }, 5000);
}

function addMessage(text, sender) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.innerHTML = '<div class="label">' + sender.toUpperCase() + '</div>' + text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

/* ===== BACKEND API CALL ===== */
async function callLLM(text) {
  const res = await fetch(CHAT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text, mode: 'voz' })
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error('HTTP ' + res.status + ': ' + errText);
  }
  return await res.json();
}

/* ===== HANDLE USER MESSAGE ===== */
async function handleUserMessage(text) {
  if (!text.trim() || isThinking) return;

  addMessage(text, 'user');
  textInput.value = '';
  updateUI('thinking');

  try {
    const data = await callLLM(text);
    const reply = data.text || '';

    if (reply) {
      addMessage(stripEmojis(reply) || reply, 'chipi');
      speakText(reply);
    } else if (data.functionCalls && data.functionCalls.length > 0) {
      const fnNames = data.functionCalls.map(f => f.name).join(', ');
      addMessage('[Ejecutando: ' + fnNames + ']', 'chipi');
      updateUI('ready');

      // Function calls also send a text fallback
      if (data.text) {
        speakText(data.text);
      }
    } else {
      addMessage('(sin respuesta del LLM)', 'chipi');
      updateUI('ready');
    }
  } catch (err) {
    showError('Error del servidor: ' + err.message);
    addMessage('Error: ' + err.message, 'chipi');
    updateUI('error');
  }
}

/* ===== SPEECH RECOGNITION ===== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'es-PE';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    if (transcript.trim()) {
      handleUserMessage(transcript);
    } else {
      updateUI('ready');
    }
  };

  recognition.onerror = (event) => {
    showError('Error de microfono: ' + event.error);
    updateUI('ready');
  };

  recognition.onend = () => {
    if (!isThinking) updateUI('ready');
  };
} else {
  micBtn.style.display = 'none';
  btnLabel.textContent = 'Mic no soportado';
}

micBtn.addEventListener('click', () => {
  if (!recognition) return;
  if (isThinking) return;
  try {
    recognition.start();
    updateUI('listening');
  } catch (e) {
    showError('No se pudo iniciar microfono: ' + e.message);
  }
});

sendBtn.addEventListener('click', () => {
  const text = textInput.value.trim();
  if (text) handleUserMessage(text);
});

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const text = textInput.value.trim();
    if (text) handleUserMessage(text);
  }
});

/* ===== INIT: check backend ===== */
fetch(STATUS_URL)
  .then(r => r.json())
  .then(data => {
    addMessage('Backend conectado: ' + (data.llm?.active || 'desconocido'), 'chipi');
    statusEl.textContent = 'Conectado';
    statusEl.style.background = 'rgba(22,199,154,.2)';
  })
  .catch(err => {
    showError('No se pudo conectar al backend: ' + err.message);
  });
</script>
</body>
</html>
